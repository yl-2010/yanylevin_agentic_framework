<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var r = document.documentElement;
          r.dataset.theme = "system";
          r.dataset.resolvedTheme = dark ? "dark" : "light";
          r.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <title>Education</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="/education/styles.css?v=drag-links-1" />
  </head>
  <body>
    <a
      class="corner c-tl squircle"
      data-liquid-glass="squircle"
      data-filter-id="lg-tl"
      href="https://yanylevin.com/"
      aria-label="Yan Levin home"
    >
      <svg viewBox="0 0 252 252" aria-hidden="true"><path fill="currentColor" d="M229.4,214.58c0,11.34-9.21,20.52-20.55,20.51l-117.33-.11c-2.66-.02-5.21-.49-7.64-1.48-9.37-3.58-14.91-14.5-12.23-24.2.17-.64.37-1.29.61-1.92,0,0,22.86-63.64,22.86-63.64L26.54,49.57c-6.68-9.17-4.66-22.01,4.51-28.69,9.17-6.67,22.01-4.65,28.68,4.51l52.17,71.64,23.93-66.63c3.8-10.58,15.47-16.08,26.05-12.28,10.59,3.81,16.09,15.47,12.28,26.05l-53.8,149.78,88.53.08c11.34.01,20.53,9.21,20.51,20.55Z"/></svg>
    </a>

    <button
      type="button"
      class="corner c-tr circle"
      data-liquid-glass="circle"
      data-filter-id="lg-tr"
      aria-label="Toggle theme"
      draggable="false"
    ></button>

    <div id="stage-loading" class="stage stage-loading" aria-live="polite">…</div>

    <div id="stage-login" class="stage" hidden>
      <a
        class="corner google-orb squircle"
        data-liquid-glass="squircle"
        data-filter-id="lg-google"
        href="/api/auth/google?next=/education/"
        aria-label="Sign in with Google"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            fill="currentColor"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="currentColor"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="currentColor"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
          />
          <path
            fill="currentColor"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
          />
        </svg>
      </a>
    </div>

    <div id="stage-denied" class="stage" hidden>
      <h1 class="denied-msg">access not granted, private site</h1>
    </div>

    <div id="stage-full" class="stage stage-full" hidden>
      <main id="edu-app" class="edu-app" aria-live="polite"></main>

      <div id="edu-chat" class="yan-chat" data-state="closed">
        <div
          class="yan-chat-panel"
          data-liquid-glass="rounded"
          data-filter-id="lg-edu-chat-panel"
          hidden
          aria-hidden="true"
          role="region"
          aria-label="Personal assistant"
        >
          <button
            type="button"
            class="yan-chat-close yan-chat-close--panel circle"
            data-liquid-glass="circle"
            data-filter-id="lg-edu-chat-x-panel"
            data-edu-chat-clear
            aria-label="New chat"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" style="transform: rotate(45deg)"><g fill="currentColor"><rect x="10.35" y="4.5" width="3.3" height="15" rx="1.65"/><rect x="4.5" y="10.35" width="15" height="3.3" rx="1.65"/></g></svg>
          </button>
          <div class="yan-chat-messages" aria-live="polite"></div>
          <div class="yan-chat-history" hidden aria-hidden="true"></div>
        </div>

        <div
          class="yan-chat-pill corner circle c-br"
          data-liquid-glass="circle"
          data-filter-id="lg-edu-chat-pill"
        >
          <button
            type="button"
            class="yan-chat-minimize yan-chat-close yan-chat-close--pill circle"
            data-liquid-glass="circle"
            data-filter-id="lg-edu-chat-minimize"
            data-edu-chat-minimize
            aria-label="Hide chat"
            tabindex="-1"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="4.5" y="10.35" width="15" height="3.3" rx="1.65"/></g></svg>
          </button>

          <button
            type="button"
            class="yan-chat-launcher"
            aria-label="Personal assistant"
            aria-expanded="false"
            aria-controls="edu-chat-input"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="10.35" y="4.5" width="3.3" height="15" rx="1.65"/><rect x="4.5" y="10.35" width="15" height="3.3" rx="1.65"/></g></svg>
          </button>

          <form class="yan-chat-form" action="#" autocomplete="off">
            <label class="visually-hidden" for="edu-chat-input">Ask your personal agent</label>
            <textarea
              id="edu-chat-input"
              class="yan-chat-input"
              name="q"
              rows="1"
              inputmode="text"
              enterkeyhint="enter"
              placeholder="Ask your personal agent…"
              maxlength="4000"
              tabindex="-1"
              autocomplete="off"
              wrap="soft"
              aria-multiline="true"
            ></textarea>
            <button
              type="submit"
              class="yan-chat-send circle"
              data-liquid-glass="circle"
              data-filter-id="lg-edu-chat-send"
              aria-label="Send. Hold send or Enter two seconds while working to interrupt."
            >
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <g stroke="currentColor" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 18.2V6.4"/>
                  <path d="M6.9 11.3L12 6.2L17.1 11.3"/>
                </g>
              </svg>
            </button>
          </form>
        </div>
      </div>
    </div>

    <svg
      class="liquid-glass-svg"
      xmlns="http://www.w3.org/2000/svg"
      width="0"
      height="0"
      aria-hidden="true"
      focusable="false"
      color-interpolation-filters="sRGB"
      style="position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none"
    >
      <defs id="liquid-glass-defs"></defs>
    </svg>

    <script src="/liquid-glass.js?v=chrome-perf13"></script>
    <script src="/theme-orb.js?v=chrome-perf6"></script>
    <script src="/yl-home-link.js?v=3"></script>
    <script src="/js/mac-api.js"></script>
    <script src="/education/markdown.js?v=nav-1"></script>
    <script src="/education/app.js?v=drag-links-1"></script>
    <script src="/js/chat-send-flight.js?v=1"></script>
    <script src="/education/chatbot.js?v=drag-links-1"></script>
  </body>
</html>
